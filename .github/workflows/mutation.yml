name: Mutation

# Do the tests test anything, or do they merely run? mutmut changes the rules
# under them one edit at a time; a mutant that survives is a change no test
# objected to.
#
# Two ways this job has already lied, both fixed here.
#
# It once generated 1,212 mutants, executed none of them, and reported success:
# `mutmut run` was wrapped in `|| true`, and the counter could not tell "none
# survived" from "none ran".
#
# Then the report read `mutmut results`, which prints only the mutants that are
# NOT killed. Grepping that for "killed" returns zero by construction, so a run
# that killed 712 of 1,212 read as a run that killed none — and the job failed
# for a fault that was in the reporting. The numbers now come from
# `mutmut export-cicd-stats`, the machine-readable summary.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Measured 2026-08-04 in a Linux container: 712 killed of 1,128 judged,
      # so 63%. The floor sits just under that for the same reason the
      # data-quality gates do — a threshold far below the value it guards is
      # not a gate.
      FLOOR: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-extras --dev

      - name: The selected tests pass before anything is mutated
        run: >-
          uv run pytest -q tests/test_normalize.py tests/test_dates.py
          tests/test_geo.py tests/test_store.py

      - name: Mutate the rules the dataset stands on
        run: uv run mutmut run --max-children 4

      - name: Report
        if: always()
        run: |
          uv run mutmut export-cicd-stats
          cp mutants/mutmut-cicd-stats.json .
          uv run mutmut results > mutmut.txt || true
          read -r killed survived total no_tests unchecked < <(jq -r '[
            .killed, .survived, .total, .no_tests,
            (.total - .killed - .survived - .suspicious - .timeout - .no_tests)
          ] | @tsv' mutmut-cicd-stats.json)
          judged=$((killed + survived))
          score=0
          [ "$judged" -gt 0 ] && score=$((100 * killed / judged))
          {
            echo "| outcome | mutants |"
            echo "| --- | ---: |"
            echo "| killed — a test objected | $killed |"
            echo "| **survived — nothing objected** | **$survived** |"
            echo "| no test covers the line | $no_tests |"
            echo "| never ran | $unchecked |"
            echo ""
            echo "**Mutation score: ${score}%** of $judged judged mutants."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "killed=$killed survived=$survived score=${score}% unchecked=$unchecked"
          if [ "$total" -eq 0 ]; then
            echo "::error::mutmut produced no results at all"
            exit 1
          fi
          if [ "$unchecked" -gt 0 ]; then
            echo "::error::$unchecked mutants never ran — this run proves nothing"
            exit 1
          fi
          if [ "$score" -lt "$FLOOR" ]; then
            echo "::error::mutation score ${score}% is below the ${FLOOR}% floor"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutmut-results
          path: |
            mutmut.txt
            mutmut-cicd-stats.json
          if-no-files-found: warn

# mutmut runs on Linux only; on Windows it refuses and asks for WSL. To iterate
# without waiting on CI, run it in a container on any Linux box:
#
#   git clone --depth 1 --filter=blob:none --sparse <repo> && cd repo
#   git sparse-checkout set --no-cone '/*' '!/data'
#   docker run --rm --cpus 6 -v "$PWD":/w -w /w \
#     ghcr.io/astral-sh/uv:python3.14-bookworm \
#     bash -lc 'uv sync --all-extras --dev && uv run mutmut run --max-children 6'
