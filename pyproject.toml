[project]
name = "wantedmt"
version = "0.1.0"
description = "Data-quality pipeline for the Ukrainian open dataset of stolen/lost mobile phones (data.gov.ua, WantedMT)"
requires-python = ">=3.13"
license = { text = "CC-BY-4.0" }
dependencies = [
    "duckdb>=1.4",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=25.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
publish = ["boto3>=1.35"]
dev = ["pytest>=8.3", "ruff>=0.9", "mypy>=1.14", "mutmut>=3.2", "types-PyYAML>=6.0"]

[project.scripts]
wantedmt = "wantedmt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wantedmt"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "boto3.*"]
ignore_missing_imports = true

[tool.mutmut]
# mutmut copies the tree into mutants/ and runs the tests there, so it needs the
# whole package present even when only a few files are mutated. Naming single
# files here produced an incomplete copy: 1_212 mutants generated, 0 executed,
# and the workflow still went green.
source_paths = ["src/wantedmt"]
do_not_mutate = [
    "src/wantedmt/cli.py",
    "src/wantedmt/publish.py",
    "src/wantedmt/notify.py",
    "src/wantedmt/sources.py",
    "src/wantedmt/download.py",
    "src/wantedmt/config.py",
    "src/wantedmt/reports.py",
    "src/wantedmt/backfill.py",
    "src/wantedmt/dq.py",
    "src/wantedmt/sql.py",
    "src/wantedmt/normalize/apply.py",
    "src/wantedmt/normalize/tac.py",
]
# Every mutant reruns this selection, so it holds the fast tests that actually
# assert the rules -- not the backfill queue tests, which spend seconds apiece.
pytest_add_cli_args_test_selection = [
    "tests/test_normalize.py",
    "tests/test_dates.py",
    "tests/test_geo.py",
    "tests/test_store.py",
]

[dependency-groups]
dev = [
    "mutmut>=3.2",
]
